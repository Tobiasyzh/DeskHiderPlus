name: Release tested Windows binary

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/release-tested-binary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      AHK_VERSION: "1.1.37.02"
      AHK_ZIP_SHA256: "6F3663F7CDD25063C8C8728F5D9B07813CED8780522FD1F124BA539E2854215F"
      EXPECTED_EXE_SHA256: "2d914c038f6f28905dcce5a8b82783f8a9bd51137088a9738f1fcacc824fbf5d"
      RELEASE_TAG: "v1.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AutoHotkey v1.1.37.02
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url1 = "https://www.autohotkey.com/download/1.1/AutoHotkey_1.1.37.02.zip"
          $url2 = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip"
          try {
            Invoke-WebRequest -Uri $url1 -OutFile ahk.zip -UseBasicParsing
          } catch {
            Invoke-WebRequest -Uri $url2 -OutFile ahk.zip -UseBasicParsing
          }
          $hash = (Get-FileHash ahk.zip -Algorithm SHA256).Hash
          Write-Host "AutoHotkey ZIP SHA256: $hash"
          if ($hash -ne $env:AHK_ZIP_SHA256) {
            throw "AutoHotkey ZIP SHA256 mismatch."
          }
          Expand-Archive -LiteralPath ahk.zip -DestinationPath ahk -Force

      - name: Compile DeskHiderPlus.exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = Join-Path $PWD "ahk\Compiler\Ahk2Exe.exe"
          $base = Join-Path $PWD "ahk\Compiler\Unicode 64-bit.bin"
          & $compiler /in "$PWD\DeskHiderPlus.ahk" /out "$PWD\DeskHiderPlus.exe" /base "$base"
          # Ahk2Exe can return before the output file is fully materialized on hosted runners.
          $deadline = (Get-Date).AddSeconds(20)
          while (!(Test-Path "$PWD\DeskHiderPlus.exe") -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (!(Test-Path "$PWD\DeskHiderPlus.exe")) {
            throw "Compilation did not produce DeskHiderPlus.exe within 20 seconds."
          }
          $hash = (Get-FileHash "$PWD\DeskHiderPlus.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Built EXE SHA256: $hash"
          Write-Host "Expected tested EXE SHA256: $env:EXPECTED_EXE_SHA256"
          if ($hash -ne $env:EXPECTED_EXE_SHA256) {
            throw "The reproducible build hash does not match the user-tested binary. Release was intentionally stopped."
          }

      - name: Publish v1.0.0 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          First public DeskHider Plus release.

          - Windows 10 focused
          - Double-click empty desktop space to hide/show desktop icons
          - Hide/restore shortcut arrows from the tray
          - Optional startup toggle
          - Shortcut-arrow feature does not poll in the background

          Tested binary SHA256:
          `2d914c038f6f28905dcce5a8b82783f8a9bd51137088a9738f1fcacc824fbf5d`
          "@
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG DeskHiderPlus.exe --clobber
          } else {
            gh release create $env:RELEASE_TAG DeskHiderPlus.exe --title "DeskHider Plus v1.0.0" --notes $notes --target "${{ github.sha }}"
          }
# Source synchronized with the tested v3 Windows binary.
