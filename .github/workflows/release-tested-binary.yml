name: Verify and release DeskHider Plus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-tested-binary.yml"
  pull_request:
    paths:
      - "DeskHiderPlus.ahk"
      - "Build.cmd"
      - "lib/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/release-tested-binary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AHK_ZIP_SHA256: "6F3663F7CDD25063C8C8728F5D9B07813CED8780522FD1F124BA539E2854215F"
      RELEASE_TAG: "v2.0"
      EXPECTED_EXE_SHA256: "2c5171ea2d9b2425d82a92ed5e483a9d99521cc4ad6b5dd0d33cbf6db7040139"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify AutoHotkey v1.1.37.02
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url1 = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip"
          $url2 = "https://www.autohotkey.com/download/1.1/AutoHotkey_1.1.37.02.zip"
          try {
            Invoke-WebRequest -Uri $url1 -OutFile ahk.zip -UseBasicParsing
          } catch {
            Invoke-WebRequest -Uri $url2 -OutFile ahk.zip -UseBasicParsing
          }
          $hash = (Get-FileHash ahk.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:AHK_ZIP_SHA256) { throw "AutoHotkey ZIP SHA256 mismatch." }
          Expand-Archive -LiteralPath ahk.zip -DestinationPath ahk -Force

      - name: Test migration, cache recovery and alpha validation (64-bit and 32-bit)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($arch in @("64", "32")) {
            $interpreter = Join-Path $PWD "ahk\AutoHotkeyU$arch.exe"
            foreach ($suite in @("ShortcutArrows", "ShellIconCache")) {
              $output = Join-Path $env:RUNNER_TEMP "$suite-tests-x$arch"
              $log = Join-Path $env:RUNNER_TEMP "$suite-tests-x$arch.log"
              $arguments = @(
                "/ErrorStdOut",
                ('"' + (Join-Path $PWD "tests\$suite.test.ahk") + '"'),
                ('"' + $output + '"')
              )
              $process = Start-Process -FilePath $interpreter -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $log
              Get-Content -LiteralPath $log
              if ($process.ExitCode -ne 0) { throw "$suite tests failed ($arch-bit)." }
            }
          }

      - name: Verify RGBA composition, scaling and image-list cache round-trip
        shell: powershell
        run: |
          $icon = Join-Path $env:RUNNER_TEMP "ShortcutArrows-tests-x64\blank_v6_argb.ico"
          python tests\verify_overlay.py $icon
          if ($LASTEXITCODE -ne 0) { throw "Overlay rendering verification failed." }

      - name: Compile and validate standalone EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = Join-Path $PWD "ahk\Compiler\Ahk2Exe.exe"
          $base = Join-Path $PWD "ahk\Compiler\Unicode 64-bit.bin"
          $source = Join-Path $PWD "DeskHiderPlus.ahk"
          $output = Join-Path $PWD "DeskHiderPlus.exe"
          $arguments = @(
            "/in", ('"' + $source + '"'),
            "/out", ('"' + $output + '"'),
            "/base", ('"' + $base + '"')
          )
          $process = Start-Process -FilePath $compiler -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $output)) { throw "Compilation failed." }
          & .\tools\Normalize-PeVersion.ps1 -Path $output
          $process = Start-Process -FilePath $output -ArgumentList "/ErrorStdOut", "/validate" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone EXE validation failed." }
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DeskHiderPlus.exe" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          "EXE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify compiled cache and alpha regression tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = Join-Path $PWD "ahk\Compiler\Ahk2Exe.exe"
          $base = Join-Path $PWD "ahk\Compiler\Unicode 64-bit.bin"
          $source = Join-Path $PWD "tests\ShellIconCache.test.ahk"
          $binary = Join-Path $env:RUNNER_TEMP "ShellIconCache.test.exe"
          $arguments = @("/in", ('"' + $source + '"'), "/out", ('"' + $binary + '"'), "/base", ('"' + $base + '"'))
          $process = Start-Process -FilePath $compiler -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $binary)) { throw "Cache test compilation failed." }
          $output = Join-Path $env:RUNNER_TEMP "compiled-cache-tests"
          $log = Join-Path $env:RUNNER_TEMP "compiled-cache-tests.log"
          $process = Start-Process -FilePath $binary -ArgumentList "/ErrorStdOut", ('"' + $output + '"') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $log
          Get-Content -LiteralPath $log
          if ($process.ExitCode -ne 0) { throw "Compiled cache/alpha tests failed." }

      - name: Keep verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskHiderPlus-verified
          path: |
            DeskHiderPlus.exe
            SHA256SUMS.txt

      - name: Publish complete v2.0 release
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXE_SHA256 -ne $env:EXPECTED_EXE_SHA256) {
            throw "Release build differs from the locally verified binary. Refusing to publish."
          }
          # A missing release is expected on first publication. In Windows
          # PowerShell, redirected native stderr would otherwise throw before
          # the exit code can be checked with ErrorActionPreference=Stop.
          $lookup = Start-Process -FilePath "gh" -ArgumentList "release", "view", $env:RELEASE_TAG -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput release-lookup.log -RedirectStandardError release-lookup-error.log
          if ($lookup.ExitCode -eq 0) {
            $existing = gh release view $env:RELEASE_TAG --json isDraft,targetCommitish | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Failed to inspect the existing release." }
            if (!$existing.isDraft -or $existing.targetCommitish -ne $env:GITHUB_SHA) {
              $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq ".sha"
              if ($LASTEXITCODE -ne 0 -or $tagCommit.Trim() -ne $env:GITHUB_SHA) {
                throw "Existing release tag does not point to this commit. Refusing to overwrite it."
              }
            }
            gh release upload $env:RELEASE_TAG DeskHiderPlus.exe SHA256SUMS.txt --clobber
          } else {
            gh release create $env:RELEASE_TAG DeskHiderPlus.exe SHA256SUMS.txt --target $env:GITHUB_SHA --title "DeskHider Plus v2.0" --notes-file RELEASE_NOTES.md --prerelease=false --draft
          }
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
          gh release edit $env:RELEASE_TAG --title "DeskHider Plus v2.0" --notes-file RELEASE_NOTES.md --prerelease=false --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed." }
