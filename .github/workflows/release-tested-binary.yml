name: Build DeskHider Plus beta

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/release-tested-binary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      AHK_ZIP_SHA256: "6F3663F7CDD25063C8C8728F5D9B07813CED8780522FD1F124BA539E2854215F"
      RELEASE_TAG: "v1.1.0-beta.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AutoHotkey v1.1.37.02
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url1 = "https://www.autohotkey.com/download/1.1/AutoHotkey_1.1.37.02.zip"
          $url2 = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip"

          try {
            Invoke-WebRequest -Uri $url1 -OutFile ahk.zip -UseBasicParsing
          } catch {
            Invoke-WebRequest -Uri $url2 -OutFile ahk.zip -UseBasicParsing
          }

          $hash = (Get-FileHash ahk.zip -Algorithm SHA256).Hash
          Write-Host "AutoHotkey ZIP SHA256: $hash"

          if ($hash -ne $env:AHK_ZIP_SHA256) {
            throw "AutoHotkey ZIP SHA256 mismatch."
          }

          Expand-Archive -LiteralPath ahk.zip -DestinationPath ahk -Force

      - name: Compile DeskHiderPlus.exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = Join-Path $PWD "ahk\Compiler\Ahk2Exe.exe"
          $base = Join-Path $PWD "ahk\Compiler\Unicode 64-bit.bin"
          $source = Join-Path $PWD "DeskHiderPlus.ahk"
          $output = Join-Path $PWD "DeskHiderPlus.exe"

          $args = @(
            "/in",  ('"' + $source + '"'),
            "/out", ('"' + $output + '"'),
            "/base",('"' + $base + '"')
          )

          $process = Start-Process -FilePath $compiler -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Ahk2Exe failed with exit code $($process.ExitCode)."
          }

          if (!(Test-Path $output)) {
            throw "Compilation did not produce DeskHiderPlus.exe."
          }

          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "DeskHiderPlus.exe SHA256: $hash"
          "EXE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish beta release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          DeskHider Plus v1.1.0 beta 1

          Changes:
          - English-only user interface.
          - Optional tray icon.
          - The tray icon can be hidden while the app keeps running.
          - Launch DeskHiderPlus.exe again to restore a hidden tray icon.
          - No additional polling, service, or permanent process was added.

          SHA-256:
          $env:EXE_SHA256
          "@

          gh release create $env:RELEASE_TAG DeskHiderPlus.exe --title "DeskHider Plus v1.1.0 beta 1" --notes $notes --target "${{ github.sha }}" --prerelease

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub beta release publishing failed."
          }
